services:
  # ==========================================
  # 1. Backend Web Service (Node.js Express)
  # ==========================================
  - type: web
    name: craftlocal-backend
    runtime: node
    plan: free
    rootDir: local-craft/backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_RETURN_URL
        sync: false
      - key: PAYOS_CANCEL_URL
        sync: false
      - key: CHAT_API_KEY
        sync: false
      - key: CHAT_API_BASE_URL
        value: https://api.openai.com/v1
      - key: CHAT_MODEL
        value: gpt-4o-mini
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ==========================================
  # 2. Frontend Static Site (Vite React SPA)
  # ==========================================
  - type: web
    name: craftlocal-frontend
    runtime: static
    rootDir: local-craft/frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
